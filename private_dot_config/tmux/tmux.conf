source-file ~/.config/tmux/tmux.reset.conf
# set -g default-terminal "${TERM}"
set-option -g terminal-overrides ',xterm-256color:RGB'

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 10000000    # keep enough scrollback for very large copies
set -g renumber-windows on       # renumber all windows when any window is closed
# tmux-yank sends selections directly to wl-copy.  Keeping OSC 52 enabled here
# makes tmux emit a second clipboard update through the terminal emulator;
# with long selections that can race the Wayland clipboard watcher and result
# in truncated or stale clipboard contents.
set -g set-clipboard off
set -g mouse on                  # enable the mouse
set -g status-position top       # macOS / darwin style
set-window-option -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g allow-passthrough on

# Use one explicit Wayland clipboard path for every tmux-yank binding.
set -g @override_copy_command '/home/night/.config/tmux/bin/wl-copy-foreground'
# tmux 3.7 can pipe copy-mode selections through a native server option.  Use
# this for the main selection bindings to avoid an extra plugin command layer.
set -g copy-command '/home/night/.config/tmux/bin/wl-copy-foreground'

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'MaximilianGaedig/tmux-filter'
set -g @plugin '2kabhishek/tmux-tilit'
set -g @plugin "janoamaral/tokyo-night-tmux"

# theme
# set -g @plugin 'fabioluciano/tmux-tokyo-night'
# set -g @plugin 'omerxx/catppuccin-tmux' # My fork that holds the meetings script bc I'm lazy af
# set -g @plugin '2kabhishek/tmux2k'
# set -g @plugin 'wfxr/tmux-power'

# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# 'L' for left only, 'R' for right only and 'LR' for both
# set -g @tmux_power_prefix_highlight_pos 'L'
# set -g @tmux_power_theme 'moon'

set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.local/share/chezmoi'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-bind-kill-session 'ctrl-q'
# This command rebinds scrolling up/down inside the preview.
set -g @sessionx-bind-scroll-up 'alt-k'
set -g @sessionx-bind-scroll-down 'alt-j'
set -g @sessionx-custom-paths 'school,work'

TMUX_FZF_LAUNCH_KEY="C-f"


set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory meetings date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"

set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

TMUX_FZF_LAUNCH_KEY="f"

# set -g @thumbs-key 'f' # default is 'space'

# set -g @fzf-url-bind 'u' # default is 'u'

# Install TPM explicitly as described in README; no network operations on startup.
if-shell 'test -f ~/.config/tmux/plugins/tpm/tpm' 'run-shell ~/.config/tmux/plugins/tpm/tpm'

# Prefer tmux's native copy-command for the primary copy actions.  These are
# placed after TPM so tmux-yank cannot replace them during plugin startup.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode y send -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Kitty/Yazi replies end with ESC-backslash, also the legacy encoding of Alt+\.
# tmux-tilit binds this to split-pane, so remove it after plugins are loaded.
# Use prefix + \ to split horizontally instead; keep image passthrough enabled.
unbind-key -n 'M-\'

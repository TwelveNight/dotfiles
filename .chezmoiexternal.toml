# Shell checkouts are full copies of their own dotfiles repositories.
# chezmoi clones/refreshes them; each repo tracks its own branch upstream.
# Record the deployed commit in .active-commit after a local sync:
#   git -C ~/.config/quickshell/inir rev-parse HEAD > ~/.config/quickshell/inir/.active-commit

[".config/quickshell/ii"]
    type = "git-repo"
    url = "https://github.com/P3DROVFX/ii-p3drovfx.git"
    refreshPeriod = "168h"
    [".config/quickshell/ii".clone]
        args = ["--branch", "night/personal-overlay", "--single-branch"]

[".config/quickshell/inir"]
    type = "git-repo"
    url = "https://github.com/snowarch/iNiR.git"
    refreshPeriod = "168h"
    [".config/quickshell/inir".clone]
        args = ["--branch", "night/personal-overlay", "--single-branch"]
